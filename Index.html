<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .balance-title {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 56px;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .click-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .click-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            border: 8px solid #1e3a8a;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5), inset 0 -10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
        }

        .click-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3), inset 0 5px 10px rgba(0,0,0,0.5);
        }

        .click-button img {
            width: 120px;
            height: 120px;
            pointer-events: none;
        }

        .tap-text {
            margin-top: 30px;
            color: #64748b;
            font-size: 18px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Ефект при кліку */
        .float-text {
            position: absolute;
            color: #fbbf24;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="balance-title">Баланс</div>
        <div class="balance-amount"><span id="score">0</span> 🪙</div>
    </div>

    <div class="click-area" id="click-area">
        <div class="click-button" id="click-btn">
            <!-- Використовуємо емодзі замість картинки для простоти -->
            <span style="font-size: 100px; line-height: 1;">🚀</span>
        </div>
        <div class="tap-text">Натискай!</div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортає на весь екран
        tg.setHeaderColor('#0f172a'); // Колір шапки

        let score = 0;
        let scoreElement = document.getElementById('score');
        let clickBtn = document.getElementById('click-btn');
        let clickArea = document.getElementById('click-area');

        // Функція для створення ефекту "+1"
        function createFloatText(x, y) {
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.innerText = '+1';
            floatText.style.left = x + 'px';
            floatText.style.top = y + 'px';
            clickArea.appendChild(floatText);

            setTimeout(() => {
                floatText.remove();
            }, 800);
        }

        // Логіка кліку
        clickBtn.addEventListener('pointerdown', (e) => {
            score++;
            scoreElement.innerText = score;
            
            // Вібрація (якщо підтримується)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Отримуємо координати кліку для ефекту
            let rect = clickArea.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            createFloatText(x, y);
        });
    </script>
</body>
</html>
